<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión | TecnoMarket</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .offline-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      max-width: 460px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .offline-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    .offline-card h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #60a5fa;
    }
    .offline-card p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .offline-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .offline-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="offline-container">
    <section class="offline-card">
      <div class="offline-icon">⚡</div>
      <h1>Modo sin conexión activo</h1>
      <p>
        En este momento no tienes conexión a Internet. Puedes volver al catálogo principal de
        <strong>TecnoMarket</strong> para consultar los datos guardados localmente en tu equipo.
      </p>
      <button class="offline-btn" onclick="window.location.href='./index.html'">
        Volver a TecnoMarket
      </button>
    </section>
  </main>
  <script>
    window.addEventListener('online', () => {
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
